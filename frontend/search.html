<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Entities - BB SLA Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { theme: { extend: { colors: { alertRed: '#ff4d4d', alertOrange: '#ff9900' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col antialiased">
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-lg tracking-wide">BB SLA Tracker</span>
                </div>
                
<div class="flex items-center space-x-6">
    <a href="index.html" class="text-gray-600 hover:text-gray-900 text-sm font-medium transition">Home</a>
    <a href="search.html" class="text-gray-600 hover:text-gray-900 text-sm font-medium transition">Search</a>
    <a href="stats.html" class="text-gray-600 hover:text-gray-900 text-sm font-medium transition">Stats</a>
    <a href="legal.html" class="text-gray-600 hover:text-gray-900 text-sm font-medium transition">Legal</a>
    <a href="submit.html" class="bg-gray-900 hover:bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg backdrop-blur-sm">Submit Report</a>
</div>
            </div>
        </div>
    </nav>
    <main class="flex-grow max-w-6xl mx-auto px-4 py-12 w-full">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black mb-4 text-gray-900">Entity Intelligence Search</h1>
            <p class="text-sm text-gray-500">Search for a company to view its full aggregated SLA track record.</p>
        </div>
        
        <div class="relative w-full max-w-2xl mx-auto mb-10 shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input type="text" id="masterSearch" placeholder="Type a protocol or company name (e.g. MakerDAO)..." class="w-full bg-white border border-gray-300 rounded-xl py-4 pl-12 pr-4 text-gray-900 focus:outline-none focus:border-alertOrange focus:ring-1 focus:ring-alertOrange transition text-lg shadow-sm">
        </div>

        <div id="searchResults" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Results injected here -->
            <div class="text-center text-gray-400 mt-10">Start typing to perform an aggregated search...</div>
        </div>
    </main>

    <footer class="border-t border-gray-200 bg-white py-6 mt-10">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">BB SLA Tracker &copy; 2026. Community Driven.</p>
            <div class="mt-2 flex justify-center items-center gap-4"><a href="legal.html" class="text-xs text-gray-400 hover:text-gray-600">Privacy Policy & Terms</a>
                <span class="text-gray-300">|</span>
                <a href="https://github.com/Yohaaaaan/bug-bounty-sla-tracker" target="_blank" class="text-xs text-gray-400 hover:text-gray-600 flex items-center gap-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path></svg> Open Source</a></div>
        </div>
    </footer>

    <script>
        
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                document.getElementById('masterSearch').value = q;
            }
        });

        let allReports = [];
        async function fetchAll() {
            try {
                const res = await fetch('/api/reports');
                allReports = await res.json();
                renderAggregated(''); // Render top ones by default
            } catch(e) { console.error(e); }
        }
        fetchAll();

        function renderAggregated(query) {
            const resultsDiv = document.getElementById('searchResults');
            if(!allReports.length) return;

            const q = query.toLowerCase().trim();
            const filtered = q ? allReports.filter(r => r.company_name.toLowerCase().includes(q)) : allReports;
            
            if(filtered.length === 0) {
                
                resultsDiv.innerHTML = `
                    <div class="col-span-full text-center py-16 px-4 bg-white rounded-2xl border border-gray-200 border-dashed">
                        <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">No intelligence found</h3>
                        <p class="text-gray-500 mb-6">This entity has a clean record, or no one has dared to report them yet.</p>
                        <a href="submit.html" class="inline-flex items-center gap-2 bg-gray-900 hover:bg-gray-800 text-white font-medium py-2.5 px-6 rounded-xl transition shadow-lg">
                            <svg class="w-5 h-5 text-alertRed" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                            Be the first to report a breach!
                        </a>
                    </div>
                `;

                return;
            }

            // Group by company
            const groups = {};
            filtered.forEach(r => {
                const name = r.company_name;
                if(!groups[name]) groups[name] = { name, count: 0, platforms: new Set(), issues: {}, lastDate: r.created_at };
                groups[name].count++;
                groups[name].platforms.add(r.platform);
                groups[name].issues[r.issue_type] = (groups[name].issues[r.issue_type] || 0) + 1;
                if(new Date(r.created_at) > new Date(groups[name].lastDate)) groups[name].lastDate = r.created_at;
            });

            // Sort by count
            const sorted = Object.values(groups).sort((a,b) => b.count - a.count);

            
            let htmlStr = '';
            sorted.forEach(g => {
                const issuesHtml = Object.entries(g.issues).map(([issue, count]) => {
                    let color = 'bg-gray-100 text-gray-700 border-gray-200';
                    if(issue.includes('Ghosting') || issue.includes('Refusal')) color = 'bg-red-50 text-alertRed border-red-100';
                    if(issue.includes('Delay') || issue.includes('Downgrade')) color = 'bg-orange-50 text-alertOrange border-orange-100';
                    return `<span class="inline-flex items-center px-2 py-1 rounded text-xs font-semibold ${color} border mr-2 mb-2">${issue} <span class="ml-1 bg-white/50 px-1 rounded text-gray-800">${count}</span></span>`;
                }).join('');

                const dateObj = new Date(g.lastDate);
                const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                htmlStr += `
                    <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between h-full">
                        <div>
                            <div class="flex flex-col mb-4 border-b border-gray-100 pb-4">
                                <h2 class="text-2xl font-black text-gray-900">${g.name}</h2>
                                <p class="text-sm text-gray-500 mt-1 mb-2">Platforms: ${Array.from(g.platforms).join(', ')}</p>
                                <div class="flex items-end justify-between w-full">
                                    <div class="text-3xl font-black text-gray-800">${g.count} <span class="text-sm font-medium text-gray-400">reports</span></div>
                                </div>
                                <div class="text-xs text-gray-400 mt-1">Last activity: ${dateStr}</div>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Issue Breakdown</h4>
                                <div class="flex flex-wrap">${issuesHtml}</div>
                            </div>
                        </div>
                        <div class="mt-6 pt-6 border-t border-gray-100">
                            <h4 class="text-sm font-bold text-gray-900 mb-3 flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                Share & Embed
                            </h4>
                            <div class="flex flex-col gap-2">
                                <button onclick="shareToX('${encodeURIComponent(g.name)}', ${g.count})" class="w-full bg-black hover:bg-gray-800 text-white py-2 px-3 rounded-lg text-xs font-medium transition flex justify-center items-center gap-2 shadow-sm">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 22.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                                    Share on X
                                </button>
                                
                            </div>
                        </div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = htmlStr;
        }

        
        function shareToX(company, count) {
            const dec = decodeURIComponent(company);
            const text = encodeURIComponent(`🚨 ${dec} has ${count} unresolved SLA breaches/ghosting reports!\n\nCheck the proofs on BB SLA Tracker:`);
            const url = encodeURIComponent(window.location.origin + '/search.html?q=' + encodeURIComponent(dec));
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
        }
        
        
        document.getElementById('masterSearch').addEventListener('input', (e) => {
            renderAggregated(e.target.value);
        });
    </script>

    <!-- Privacy-respecting Analytics -->
    <script>
        fetch('/api/ping', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: window.location.pathname || '/' })
        }).catch(e => {});
    </script>
</body>
</html>
