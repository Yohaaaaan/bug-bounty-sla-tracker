<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - SLAScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Secret Admin Panel - SLAScan</h1>
        
        <div id="loginSection" class="bg-white p-6 rounded shadow-sm border border-gray-200 mb-6">
            <input type="password" id="adminPwd" placeholder="Enter Admin Password" class="border p-2 rounded mr-2">
            <button onclick="loadAll()" class="bg-blue-600 text-white px-4 py-2 rounded">Login</button>
        </div>

        <!-- Analytics Section -->
        <div id="analyticsSection" class="hidden mb-10">
            <h2 class="text-xl font-semibold mb-3">📊 Traffic Analytics</h2>
            <p class="text-xs text-gray-400 mb-3">Unique visitors = distinct IPs per day. Same IP reloading won't inflate daily uniques, but counts as a new unique the next day.</p>
            <table class="w-full text-sm border border-gray-200 rounded overflow-hidden shadow-sm">
                <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
                    <tr>
                        <th class="text-left px-4 py-2">Page</th>
                        <th class="text-right px-4 py-2">Unique (All-Time)</th>
                        <th class="text-right px-4 py-2 text-blue-600">Unique (This Week)</th>
                        <th class="text-right px-4 py-2 text-alertOrange">Unique (Today)</th>
                    </tr>
                </thead>
                <tbody id="analyticsBody" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>

        <!-- Messages Section -->
        <h2 class="text-xl font-semibold mb-3 hidden" id="messagesTitle">📬 Contact Messages</h2>
        <div id="messagesGrid" class="space-y-4 hidden"></div>
    </div>
    <script>
        let pwd = '';

        async function loadAll() {
            pwd = document.getElementById('adminPwd').value;
            const res = await fetch('/api/admin/messages', {
                headers: { 'Authorization': 'Bearer ' + pwd }
            });
            if (!res.ok) return alert('Bad password');
            
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('analyticsSection').classList.remove('hidden');
            document.getElementById('messagesTitle').classList.remove('hidden');
            document.getElementById('messagesGrid').classList.remove('hidden');

            loadAnalytics();
            loadMessages();
        }

        async function loadAnalytics() {
            const res = await fetch('/api/admin/analytics', {
                headers: { 'Authorization': 'Bearer ' + pwd }
            });
            if (!res.ok) return;
            const rows = await res.json();
            const tbody = document.getElementById('analyticsBody');
            tbody.innerHTML = '';

            const pageNames = {
                '/': 'Home',
                '/index.html': 'Home (index.html)',
                '/submit.html': 'Submit a Report',
                '/about.html': 'About',
                '/contact.html': 'Contact',
            };

            const validRows = rows.filter(r => !['/stats.html', '/legal.html', '/search.html'].includes(r.path));
            validRows.forEach(r => {
                const label = pageNames[r.path] || r.path;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 font-mono text-gray-700">${label}</td>
                        <td class="px-4 py-2 text-right">${r.uniques}</td>
                        <td class="px-4 py-2 text-right font-semibold text-blue-600">${r.unique_this_week ?? 0}</td>
                        <td class="px-4 py-2 text-right font-bold text-alertOrange">${r.unique_today ?? 0}</td>
                    </tr>
                `;
            });
        }

        async function loadMessages() {
            const res = await fetch('/api/admin/messages', {
                headers: { 'Authorization': 'Bearer ' + pwd }
            });
            const msgs = await res.json();
            const grid = document.getElementById('messagesGrid');
            grid.innerHTML = '';
            msgs.forEach(m => {
                grid.innerHTML += `
                    <div class="bg-white p-6 rounded shadow-sm border border-gray-200">
                        <div class="flex justify-between items-start mb-4 border-b pb-4">
                            <div>
                                <h3 class="font-bold">${m.name} (${m.company})</h3>
                                <a href="mailto:${m.email}" class="text-blue-500 text-sm">${m.email}</a>
                            </div>
                            <span class="text-xs text-gray-400">${new Date(m.created_at).toLocaleString()}</span>
                        </div>
                        <p class="text-gray-700 whitespace-pre-wrap">${m.content}</p>
                        <button onclick="del('${m.id}')" class="mt-4 text-red-500 text-sm">Delete Message</button>
                    </div>
                `;
            });
        }
        
        async function del(id) {
            if(!confirm('Delete this message?')) return;
            await fetch('/api/admin/messages/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + pwd }
            });
            loadMessages();
        }
    </script>
</body>
</html>
